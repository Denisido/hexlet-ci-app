name: CI

on: push

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26.10.0'

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - name: Setup
        run: make setup

      - name: Lint
        run: make lint

      - name: Test
        run: make test
